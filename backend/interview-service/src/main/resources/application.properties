spring.application.name=interview-service
server.port=8083

# ── PostgreSQL ──────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:internview}
spring.datasource.username=${POSTGRES_USER:internview}
spring.datasource.password=${POSTGRES_PASSWORD:internview_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────
# Not: Flyway migration devreye girene kadar lokal çalıştırmada tabloyu JPA oluştursun.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ──────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_interview
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ── Redis ───────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Kafka ───────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=interview-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

internview.kafka.topics.booking-events=booking-events
internview.kafka.topics.interview-events=interview-events

# ── WebRTC Signaling (Hafta 8) ───────────────────────────
internview.signaling.redis.key-prefix=signaling
internview.signaling.room.ttl-seconds=7200
internview.signaling.message.max-payload-bytes=65536
# İstemciye dönülen tam WebSocket URL (gateway üzerinden: 8080; doğrudan interview-service: 8083)
internview.signaling.ws-base-url=${INTERVIEW_SIGNALING_WS_BASE_URL:ws://localhost:8080}

# ── Security / JWT ──────────────────────────────────────
auth.jwt.secret=${AUTH_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

# ── Actuator Health ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
