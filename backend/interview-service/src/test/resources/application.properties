spring.application.name=interview-service-test

# ── H2 ──────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:interview_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA ─────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ── Flyway (test için kapalı) ───────────────────────────
spring.flyway.enabled=false

# ── Kafka (test) ────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=interview-service-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
internview.kafka.topics.booking-events=booking-events
internview.kafka.topics.interview-events=interview-events

# ── Security / JWT ──────────────────────────────────────
auth.jwt.secret=test-only-super-secret-change-me-test-only-super-secret-change-me

