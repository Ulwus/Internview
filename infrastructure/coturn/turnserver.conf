# ─────────────────────────────────────────────────────────
# Coturn TURN/STUN Server Configuration — Internview
# ─────────────────────────────────────────────────────────

# Listener port for STUN and TURN (UDP & TCP)
listening-port=3478

# TLS listener port (production ortamında kullanılacak)
# tls-listening-port=5349

# Relay address range for media traffic
min-port=49152
max-port=65535

# Realm (domain identifier)
realm=internview.io

# ── Authentication ──────────────────────────────────────
# HMAC-based time-limited credentials (use-auth-secret modu)
# Backend, shared secret ile geçici credential üretir.
# Coturn aynı secret ile doğrulama yapar.
use-auth-secret
static-auth-secret=internview_turn_secret

# ── Security ────────────────────────────────────────────
# Fingerprint attribute eklenmesi (RFC 5389)
fingerprint

# Multicast peer'lere relay yapma
no-multicast-peers

# CLI arayüzünü kapat (güvenlik)
no-cli

# Stale nonce süresini ayarla (saniye)
stale-nonce=600

# ── Logging ─────────────────────────────────────────────
# Log dosyasına değil stdout'a yaz (Docker uyumlu)
log-file=stdout

# Verbose loglama (geliştirme ortamı için)
verbose

# ── Performance ─────────────────────────────────────────
# Relay thread sayısı
relay-threads=2

# ── Network ─────────────────────────────────────────────
# IPv4 only (Docker ortamında)
no-tlsv1
no-tlsv1_1
