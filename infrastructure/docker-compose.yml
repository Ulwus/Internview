version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: internview-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  redis:
    image: redis:7-alpine
    container_name: internview-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: internview-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # İki listener: container içi (kafka:9092) ve host (localhost:29092)
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_LOG_DIRS: /bitnami/kafka/data
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-abcdefghijklmnopqrstuv}
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - ./kafka/data:/bitnami/kafka/data
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  consul:
    image: hashicorp/consul:1.17
    container_name: internview-consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    volumes:
      - ./consul/data:/consul/data
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  gateway:
    build:
      context: ../backend/gateway
    container_name: internview-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      INTERVIEW_SERVICE_URL: http://interview-service:8083
      BOOKING_SERVICE_URL: http://booking-service:8084
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - auth-service
      - user-service
      - booking-service
      - interview-service
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  auth-service:
    build:
      context: ../backend/auth-service
    container_name: internview-auth-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  user-service:
    build:
      context: ../backend/user-service
    container_name: internview-user-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  booking-service:
    build:
      context: ../backend/booking-service
    container_name: internview-booking-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  interview-service:
    build:
      context: ../backend/interview-service
    container_name: internview-interview-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - ${DOCKER_NETWORK:-internview-net}

networks:
  internview-net:
    name: ${DOCKER_NETWORK:-internview-net}
    driver: bridge

