name: internview

services:
  postgres:
    image: postgres:16-alpine
    container_name: internview-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: internview-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@internview.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin_password}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./postgres/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  redis:
    image: redis:7-alpine
    container_name: internview-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: internview-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # İki listener: container içi (kafka:9092) ve host (localhost:29092)
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_LOG_DIRS: /bitnami/kafka/data
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-abcdefghijklmnopqrstuv}
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - ./kafka/data:/bitnami/kafka/data
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  consul:
    image: hashicorp/consul:1.17
    container_name: internview-consul
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    volumes:
      - ./consul/data:/consul/data
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  gateway:
    build:
      context: ../backend/gateway
    container_name: internview-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      USER_SERVICE_URL: http://user-service:8082
      INTERVIEW_SERVICE_URL: http://interview-service:8083
      BOOKING_SERVICE_URL: http://booking-service:8084
      MEDIA_SERVICE_URL: http://media-service:${MEDIA_SERVER_PORT:-3000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - auth-service
      - user-service
      - booking-service
      - interview-service
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  auth-service:
    build:
      context: ../backend/auth-service
    container_name: internview-auth-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  user-service:
    build:
      context: ../backend/user-service
    container_name: internview-user-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  booking-service:
    build:
      context: ../backend/booking-service
    container_name: internview-booking-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERVIEW_SERVICE_URL: http://interview-service:8083
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - redis
      - kafka
      - interview-service
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: internview-coturn
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49152-49252:49152-49252/udp"
    networks:
      - ${DOCKER_NETWORK:-internview-net}
    restart: unless-stopped

  interview-service:
    build:
      context: ../backend/interview-service
    container_name: internview-interview-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-internview}
      POSTGRES_USER: ${POSTGRES_USER:-internview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internview_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      TURN_SECRET: ${TURN_SECRET:-internview_turn_secret}
      TURN_HOST: coturn
      MEDIA_SERVICE_URL: http://media-service:${MEDIA_SERVER_PORT:-3000}
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - redis
      - kafka
      - coturn
      - media-service
    networks:
      - ${DOCKER_NETWORK:-internview-net}

  media-service:
    build:
      context: ../backend/media-service
    container_name: internview-media-service
    environment:
      PORT: ${MEDIA_SERVER_PORT:-3000}
      LOG_LEVEL: ${MEDIA_SERVER_LOG_LEVEL:-info}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-}
      MEDIASOUP_MIN_PORT: ${MEDIASOUP_MIN_PORT:-40000}
      MEDIASOUP_MAX_PORT: ${MEDIASOUP_MAX_PORT:-40099}
      MEDIASOUP_LOG_LEVEL: ${MEDIASOUP_LOG_LEVEL:-warn}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RECORDING_SEGMENTS_TOPIC: recording-segments
      RECORDING_SEGMENT_SECONDS: ${RECORDING_SEGMENT_SECONDS:-10}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-internview-recordings}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "${MEDIA_SERVER_PORT:-3000}:${MEDIA_SERVER_PORT:-3000}"
      - "${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40099}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40099}/udp"
      - "${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40099}:${MEDIASOUP_MIN_PORT:-40000}-${MEDIASOUP_MAX_PORT:-40099}/tcp"
    depends_on:
      - minio
    networks:
      - ${DOCKER_NETWORK:-internview-net}
    restart: unless-stopped

  ai-analysis-service:
    build:
      context: ../backend/ai-analysis-service
    container_name: internview-ai-analysis-service
    environment:
      DATABASE_URL: postgresql://internview:${POSTGRES_PASSWORD:-internview_password}@postgres:5432/${POSTGRES_DB:-internview}
      CONSUL_URL: http://consul:8500
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERVIEW_EVENTS_TOPIC: interview-events
      ANALYSIS_EVENTS_TOPIC: analysis-events
      ENABLE_KAFKA_CONSUMER: "true"
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-tr}
      PRELOAD_WHISPER_MODEL: ${PRELOAD_WHISPER_MODEL:-false}
      WHISPER_DOWNLOAD_ROOT: /models/whisper
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-internview-recordings}
      S3_FORCE_PATH_STYLE: "true"
      RECORDING_SEGMENTS_TOPIC: recording-segments
    ports:
      - "8000:8000"
    volumes:
      - ${WHISPER_CACHE_HOST_DIR:-/Volumes/M2SSD/internview/whisper-cache}:/models/whisper
    depends_on:
      - postgres
      - kafka
      - minio
      - consul
    networks:
      - ${DOCKER_NETWORK:-internview-net}
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: internview-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
    networks:
      - ${DOCKER_NETWORK:-internview-net}
    restart: unless-stopped

  # MinIO başlatıldığında varsayılan bucket oluşturur
  minio-init:
    image: minio/mc
    container_name: internview-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${S3_BUCKET:-internview-recordings};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-internview-recordings}
    networks:
      - ${DOCKER_NETWORK:-internview-net}

networks:
  internview-net:
    name: ${DOCKER_NETWORK:-internview-net}
    driver: bridge
